# LaTeX math-mode grammar — a Wikipedia-style formula subset (NOT full LaTeX).
# Targets the kind of inline math you'd typeset in a Wikipedia article:
# fractions, square roots, scripts, Greek letters, big operators, and the
# usual arithmetic/relational operators. Prose, environments, alignments,
# colour, and macro definitions are deliberately out of scope — those belong
# to a real LaTeX engine, not a four-file LALR(1) demo.
#
# Things that work:
#   E = mc^2
#   e^{i\pi} + 1 = 0
#   \frac{1}{2} + \frac{1}{3}
#   \sqrt{x^2 + y^2}
#   \sum_{i=0}^{n} i = \frac{n(n+1)}{2}
#   \sin(\alpha + \beta) = \sin\alpha \cos\beta + \cos\alpha \sin\beta
#   \sqrt[3]{x}, \sqrt[n]{x^2+1}           (n-th root: optional index)
#   [a, b], [0, 1), (0, 1]                 (brackets, half-open intervals)
#   \{1, 2, 3\}, \{x\}                     (escaped braces: a set, drawn as braces)
#   f(), [], \{\}                          (empty pairs)
#   \mathrm{d}x, \mathrm{H}_{2}\mathrm{O}   (upright letters, as TeX's \mathrm)
#   \operatorname{tr} A, \textrm{if}       (an operator name; upright text)
#   \{ x \in \mathbb{R} \mid x > 0 \}     (set-builder: \mid, \mathbb, < and >)
#
# Things that don't:
#   - \begin{...}\end{...} environments, alignments, multi-line displays.
#   - Macro definitions (\def, \newcommand) and any TeX programming.
#   - String content inside \text{...} (treated as opaque \cmd). \textrm{...}
#     is lexed whole, so its blanks survive, with groups inside two deep.
#   - Implicit prefix unary minus inside group-arguments without parens
#     (e.g. \frac{-1}{2} works because -1 reduces via F -> '-' F, but
#     \sqrt -2 does not — write \sqrt{-2}).
#   - Multi-letter "function names" like \sin or \cos are kept as opaque
#     `cmd` atoms; the visitor maps them to readable text. The grammar does
#     not enforce arity (\sin x parses as juxtaposition), which matches how
#     LaTeX itself handles them.
#
# Precedence (lowest to highest):
#   E:  + - =                                            (additive/relational, leftmost)
#   T:  * /, juxtaposition (T F2)                        (multiplicative, leftmost)
#   F:  unary -                                          (right-associative)
#   F2: P                                                (factor without unary — used by
#                                                         juxtaposition so that "1-2"
#                                                         doesn't parse as 1·(-2))
#   P:  ^ _                                              (postfix scripts, leftmost)
#   A:  atoms (numbers, identifiers, commands, groups, parens, brackets,
#       braces, \frac, \sqrt, \mathrm, \mathbb, \operatorname, \textrm)
#   A0: every atom except the ones that open with `[`
#
# Why A0 exists: LaTeX reads a `[` straight after \sqrt as the start of the
# optional index, never as a bracket group that is the radicand. A bare
# \sqrt therefore takes an A0 radicand, which cannot start with `[`, so on
# a `[` after cmdsqrt the only item that can shift is the index rule's. With
# an A radicand the parser reaches `\sqrt [ E ]` holding both "reduce the
# bracket atom" and "shift the radicand after an index", which is 9 S/R
# conflicts, one per token that can start an atom. A radicand that really
# is a bracket group goes in braces, as in LaTeX: \sqrt{[a, b]}.
#
# The split between F (unary minus allowed) and F2 (no unary) is what keeps
# LALR(1) happy. Juxtaposition uses F2 so the parser can never "see" a leading
# `-` as starting a juxtaposed factor — that disambiguates the classic
# "1 - 2" vs. "1·(-2)" S/R conflict cleanly without any precedence hack.

symbols:
  - S          # 0  start
  - E          # 1  expression (additive/relational)
  - T          # 2  term (multiplicative + juxtaposition)
  - F          # 3  factor (unary minus allowed)
  - F2         # 4  factor without unary minus (used by juxtaposition)
  - P          # 5  postfix-script wrapper
  - A          # 6  atom
  - '+'        # 7
  - '-'        # 8
  - '*'        # 9   matched by raw '*' or by \cdot / \times
  - '/'        # 10
  - '='        # 11
  - '^'        # 12
  - '_'        # 13
  - '('        # 14
  - ')'        # 15
  - '{'        # 16
  - '}'        # 17
  - n          # 18  number literal
  - id         # 19  single-letter identifier (math-italic variable)
  - cmd        # 20  catchall \name — Greek letters, function names, big operators
  - cmdfrac    # 21  \frac (binds two atom arguments)
  - cmdsqrt    # 22  \sqrt (binds one atom argument)
  - rel        # 23  binary relation: \approx \leq \geq \neq \equiv \ll \gg
                    # \in \notin \subset \to \leftarrow \rightarrow \pm \mp.
                    # Distinct from `cmd` so the parser folds them as proper
                    # binary operators via E → E rel T, not as juxtaposed
                    # atoms (which would lose surrounding whitespace and
                    # render "γ≈1" instead of "γ ≈ 1" downstream).
  - WS         # 24  whitespace (ignored)
  - A0         # 25  atom that does not open with '[' (a bare \sqrt's radicand)
  - '['        # 26
  - ']'        # 27
  - ','        # 28  punctuation atom: [a, b], f(x, y), x_{i,j}
  - cmdmathrm  # 29  \mathrm (binds one atom argument, which it sets upright)
  - lbrace     # 30  \{ : a brace as a glyph, where a bare '{' opens a group
  - rbrace     # 31  \}
  - cmdmathbb  # 32  \mathbb (binds one atom argument, which it sets double-struck)
  - opname     # 33  \operatorname{X} or \operatorname*{X}, its braced name in the token
  - textrm     # 34  \textrm{X}, its braced text in the token

productions:
  # Start production. Single-non-terminal so it trims at parse time and the
  # root Item carries the same content as E — the visitor never sees this rule.
  - derivation: none
    rules:
      - { lhs: S, rhs: [E] }

  # Additive / relational. `=` is folded in here at the lowest precedence so
  # `a + b = c + d` parses as expected; mathematicians can quibble. The `rel`
  # arm covers \approx / \leq / \geq / ... — keeping it next to `=` puts all
  # comparison-style operators at the same precedence level, which matches
  # standard math reading order ("a + b ≈ c" binds + tighter than ≈).
  - derivation: leftmost
    rules:
      - { lhs: E, rhs: [E, '+', T],  action: add }
      - { lhs: E, rhs: [E, '-', T],  action: subtract }
      - { lhs: E, rhs: [E, '=', T],  action: eq }
      - { lhs: E, rhs: [E, rel, T],  action: rel }
      - { lhs: E, rhs: [T] }

  # Multiplicative + juxtaposition. The `T -> T F2` rule is the implicit-
  # multiplication slot ("xy" = "x · y", "n(n+1)" = "n · (n+1)") and uses
  # F2 (no unary) so juxtaposition can never absorb a subsequent `-`.
  - derivation: leftmost
    rules:
      - { lhs: T, rhs: [T, '*', F],  action: mul }
      - { lhs: T, rhs: [T, '/', F],  action: div }
      - { lhs: T, rhs: [T, F2],      action: juxt }
      - { lhs: T, rhs: [F] }

  # Unary minus. Right-associative: `--x` is `-(-x)`. Group derivation is
  # rightmost mostly for documentation — there's no real ambiguity to resolve
  # since unary minus only appears at the head of an F.
  - derivation: rightmost
    rules:
      - { lhs: F, rhs: ['-', F], action: neg }
      - { lhs: F, rhs: [F2] }

  - derivation: none
    rules:
      - { lhs: F2, rhs: [P] }

  # Postfix scripts. Left-associative — `x^2^3` parses as `(x^2)^3`. (Real
  # LaTeX flags this as a "double superscript" error; we just accept it.)
  - derivation: leftmost
    rules:
      - { lhs: P, rhs: [P, '^', A], action: sup }
      - { lhs: P, rhs: [P, '_', A], action: subscript }
      - { lhs: P, rhs: [A] }

  # Atoms: leaves of the expression tree. \frac takes A-typed arguments and
  # \sqrt an A0 (an A that does not open with `[`), which means both
  # `\frac 1 2` and `\frac{1}{2}` parse: in the
  # second case each `{ E }` is itself an A via the `group` rule. That's the
  # same "single token or braced group" rule LaTeX itself uses for command
  # arguments — kept verbatim so this example can stress-test the parser
  # against grammars where two non-terminals sit adjacent in an RHS.
  #
  # The atoms that open with `[` are A's own; everything else is an A0 (see
  # the header for why). `bracket` covers the matched [E] and both half-open
  # mixes, [E) and (E]; the visitor reads which delimiters it got from Arg0
  # and Arg2. `brace` is the escaped pair \{E\}, a set: drawn as braces, where
  # the bare pair {E} is an invisible group. It is an A0, like `(`: only a
  # `[` means something else straight after \sqrt. `emptyPair` is the pair
  # with nothing inside, (), [] or \{\}, which E cannot be; Arg0 says which.
  # `,` is an atom rather than an operator so it can sit wherever a
  # \name could, which is exactly where the Unicode path's placeholder for an
  # unlexed comma used to sit: a trailing "x = 1," still parses.
  - derivation: none
    rules:
      - { lhs: A,  rhs: [A0] }
      - { lhs: A,  rhs: ['[', E, ']'],     action: bracket }
      - { lhs: A,  rhs: ['[', E, ')'],     action: bracket }
      - { lhs: A,  rhs: ['[', ']'],        action: emptyPair }
      - { lhs: A0, rhs: [n],               action: number }
      - { lhs: A0, rhs: [id],              action: variable }
      - { lhs: A0, rhs: [cmd],             action: command }
      - { lhs: A0, rhs: [','],             action: punct }
      - { lhs: A0, rhs: ['(', E, ')'],     action: paren }
      - { lhs: A0, rhs: ['(', E, ']'],     action: bracket }
      - { lhs: A0, rhs: ['{', E, '}'],     action: group }
      - { lhs: A0, rhs: [lbrace, E, rbrace], action: brace }
      - { lhs: A0, rhs: ['(', ')'],        action: emptyPair }
      - { lhs: A0, rhs: [lbrace, rbrace],  action: emptyPair }
      - { lhs: A0, rhs: [cmdsqrt, A0],     action: sqrt }
      - { lhs: A0, rhs: [cmdsqrt, '[', E, ']', A], action: nthRoot }
      - { lhs: A0, rhs: [cmdfrac, A, A],   action: frac }
      - { lhs: A0, rhs: [cmdmathrm, A],    action: mathRm }
      - { lhs: A0, rhs: [cmdmathbb, A],    action: mathBb }
      - { lhs: A0, rhs: [opname],          action: operatorName }
      - { lhs: A0, rhs: [textrm],          action: textRm }

# Single lexer state. Ordering matters: `\frac`, `\sqrt`, `\mathrm`, `\mathbb` (and the explicit
# multiplication aliases `\cdot` / `\times`) must come before the `\\[a-zA-Z]+`
# catchall so first-rule-wins picks them on identical-length matches. (Longer
# real names like `\fraction` would still win via longest-match — they fall
# through to `cmd` as opaque atoms, which is what we want.)
lexer:
  root:
    - { symbol: cmdfrac, match: '\\frac' }
    - { symbol: cmdsqrt, match: '\\sqrt' }
    - { symbol: cmdmathrm, match: '\\mathrm' }
    - { symbol: cmdmathbb, match: '\\mathbb' }
    # \operatorname and \textrm take their braced argument into the token,
    # because the argument is text: the grammar would read `if` as two
    # variables and drop the blank in `a b`. The argument is any run of
    # plain characters, escape pairs (\{ \, \PHa) and groups nested up to two
    # deep, each of the same: `arg{\,}max`, `a {b} c`, `x\{y\}`. Deeper
    # than that, the longest match is the bare name, which falls to `cmd`.
    - { symbol: opname,  match: '\\operatorname\*?[ \t\r\n]*\{([^\{\}\\]|\\.|\{([^\{\}\\]|\\.|\{([^\{\}\\]|\\.)*\})*\})*\}' }
    - { symbol: textrm,  match: '\\textrm[ \t\r\n]*\{([^\{\}\\]|\\.|\{([^\{\}\\]|\\.|\{([^\{\}\\]|\\.)*\})*\})*\}' }
    - { symbol: '*',     match: '\\cdot' }
    - { symbol: '*',     match: '\\times' }
    # Binary relations. Must precede the `\\[a-zA-Z]+` catchall so on the
    # tied-length cases (e.g. input `\approx`) the `rel` rule wins by
    # first-rule-wins. Longer real names like `\approxer` still go to `cmd`
    # via longest-match. Order within this group doesn't matter — each is
    # a literal token, no overlap.
    - { symbol: rel,     match: '\\approx' }
    - { symbol: rel,     match: '\\equiv' }
    - { symbol: rel,     match: '\\leq' }
    - { symbol: rel,     match: '\\geq' }
    - { symbol: rel,     match: '\\neq' }
    - { symbol: rel,     match: '\\ll' }
    - { symbol: rel,     match: '\\gg' }
    - { symbol: rel,     match: '\\in' }
    - { symbol: rel,     match: '\\notin' }
    - { symbol: rel,     match: '\\subset' }
    - { symbol: rel,     match: '\\to' }
    # \leftrightarrow and \rightleftharpoons before \leftarrow / \rightarrow
    # so longest-match wins (the shorter names are prefixes of the longer
    # ones only at the lexer-name level; on input strings they're distinct,
    # but listing the long forms first keeps the file scannable).
    - { symbol: rel,     match: '\\leftrightarrow' }
    - { symbol: rel,     match: '\\rightleftharpoons' }
    - { symbol: rel,     match: '\\leftarrow' }
    - { symbol: rel,     match: '\\rightarrow' }
    - { symbol: rel,     match: '\\pm' }
    - { symbol: rel,     match: '\\mp' }
    - { symbol: rel,     match: '\\mid' }
    # < and > as written. The Unicode path never lexes them: its lexer-safety
    # pass turns each into a placeholder atom first, as it always has.
    - { symbol: rel,     match: '<' }
    - { symbol: rel,     match: '>' }
    - { symbol: cmd,     match: '\\[a-zA-Z]+' }
    - { symbol: n,       match: '[0-9]+(\.[0-9]+)?' }
    - { symbol: id,      match: '[a-zA-Z]' }
    - { symbol: '+',     match: '\+' }
    - { symbol: '-',     match: '\-' }
    - { symbol: '*',     match: '\*' }
    - { symbol: '/',     match: '/' }
    - { symbol: '=',     match: '=' }
    - { symbol: '^',     match: '\^' }
    - { symbol: '_',     match: '_' }
    - { symbol: '(',     match: '\(' }
    - { symbol: ')',     match: '\)' }
    - { symbol: '{',     match: '\{' }
    - { symbol: '}',     match: '\}' }
    - { symbol: lbrace,  match: '\\\{' }
    - { symbol: rbrace,  match: '\\\}' }
    - { symbol: '[',     match: '\[' }
    - { symbol: ']',     match: '\]' }
    - { symbol: ',',     match: ',' }
    - { symbol: WS,      match: '[ \t\r\n]+', action: ignore }
