name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Major-version bump 4.0 - codec divorce: DIR.Lib no longer pulls SharpAstro.Tiff /
  # .Exif / .Png / .Color.Icc transitively. BoxRasterizer.RenderToRgba returns an
  # RgbaImage; the (byte[], int, int) tuple form + RenderToPng helper are gone.
  # Consumers that need PNG/TIFF/JPEG encode the RgbaImage themselves.
  # Minor bump 4.1 - markdown subsystem (grammars + AST + visitors + mhchem)
  # moved here from Console.Lib so the parser layer is reusable beyond TUIs.
  # Minor bump 4.2 - mhchem Phase-2: \ce{...} bodies now emit LaTeX math source
  # (Mhchem.Render → Mhchem.ToLatex) so chem flows through the same parser +
  # visitor pipeline as ordinary math. Display chem picks up real sub/super
  # box layout under BoxBuildingVisitor (Sixel / sextant / half-block) — the
  # box renderer earns proper layout for free. Latex grammar gains
  # \rightleftharpoons / \leftrightarrow as rel tokens; both visitors gain
  # \plus / \minus sign atoms (mhchem rewrites postfix +/- in script bodies
  # to these because the grammar treats bare +/- as binary operators).
  VERSION_PREFIX: 4.4.${{ github.run_number }}
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test -c $BUILD_CONF --no-build
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}
