name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # Listing types replaces the default set, so the three defaults are spelled out. 'labeled' is the
    # addition: labelling an already open PR 'preview' must start a run, or the label would only take
    # effect on the PR's next push. A 'labeled' run for any other label is skipped by the build job's
    # condition, so triage labels cost no CI; see the VERSION_SUFFIX step and the publish-preview job.
    types: [opened, synchronize, reopened, labeled]
  # A push event can arrive LATE, and the difference from a lost one is not observable while you wait:
  # the 9.4 merge's run was created 12 minutes after the commit, with the API reporting zero runs for
  # that sha throughout -- indistinguishable from a drop until it appeared. Without this trigger the
  # only recovery from an event that truly never lands is an empty commit, so the wait ends either in a
  # junk commit or in an unpublished package nothing reports, because there is no run to fail.
  # Dispatch publishes for the same reason a push does -- see publish-nuget's condition, which names
  # both events rather than assuming a run on main is a push.
  workflow_dispatch:

env:
  # Release notes live in CHANGELOG.md at the repo root, not here. Nothing in this workflow ever
  # read them -- there is no PackageReleaseNotes and no read-back -- so they were prose parked in a CI
  # file, and the reason given for the location (a double hyphen is illegal inside an XML comment) was
  # only ever an argument against putting them in the csproj.
  # The version NUMBER stays in src/Directory.Build.props (VersionMajorMinor), which the build job
  # reads back rather than restating, so a package cannot declare a version the notes disagree with.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The build job CAPTURES a dotnet invocation's stdout to resolve the version, so the SDK's
  # first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    # A 'labeled' run for any label but 'preview' has nothing to add: the PR's own opened or synchronize
    # run already built and tested this commit, and no other label changes what the build reads. So that
    # one event is skipped here, and publish-preview, which needs this job, is skipped with it.
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'preview'
    # One live build per pull request, newest wins. A PR created with 'gh pr create --label preview'
    # fires 'opened' and 'labeled' within a second of each other, both carrying the label, and each run
    # would publish its own prerelease of the same commit. The later run cancels the earlier one's
    # build, so one package set is pushed; a push to the PR likewise cancels the build of the commit it
    # replaced, which is then never published. Only THIS job is in the group, so a cancellation can never
    # reach a publish job half way through its push. Every other run (a push or a dispatch on main, and
    # a label event that is skipped above) gets its own group, keyed by run id, and so is never cancelled
    # and never cancels anything: a release build on main must always run to its publish.
    concurrency:
      group: ci-build-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'preview') && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      # The exact version stamped on the packages, with no +sha build metadata (that is not part of a
      # package's identity or its file name). The publish job reads it from here instead of recomputing
      # it from github.run_attempt: a re-run of only the failed jobs raises the attempt number, but the
      # packages were stamped by the build of the attempt before.
      version: ${{ steps.resolve.outputs.version }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      id: resolve
      # Read the version back from the one place it is written (src/Directory.Build.props) instead of
      # restating it here — CI stamps -p:Version across every package, so a hard-coded copy here could
      # ship packages whose version disagrees with the one they declare. -getProperty only EVALUATES
      # the file: nothing is built and no restore is needed, so this can run before restore.
      # The value is CAPTURED, so nothing else may print to stdout: DOTNET_NOLOGO (workflow env) keeps
      # the SDK first-run banner out — this is the job's first dotnet call — and the shape check makes
      # anything else unexpected, or a renamed property, fail the run rather than quietly stamping
      # every package ".<run>".
      # VERSION_SUFFIX is the preview path. A pull_request run whose PR carries the 'preview' label and
      # whose head branch lives in THIS repository gets "-pr<N>", which makes the stamped version a
      # prerelease (11.50.4121-pr196) that the publish-preview job pushes. Every other run (a push or a
      # dispatch on main, an unlabelled PR, a fork PR) gets an empty suffix and stamps exactly what it
      # always did. The event values come in through env:, never interpolated into the script, so text
      # from a PR cannot become shell. The label list is the one in THIS run's event payload, which for a
      # 'labeled' event already holds the label just added. The suffix goes into Version only, never
      # FileVersion: a prerelease tag is illegal in a file version.
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        IS_PREVIEW: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview') && github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        MM="$(dotnet msbuild src/Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from src/Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        PREFIX="${MM}.${{ github.run_number }}"
        echo "VERSION_PREFIX=${PREFIX}" >> "$GITHUB_ENV"
        SUFFIX=""
        if [ "$IS_PREVIEW" = "true" ]; then
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "::error::preview build without a numeric pull request number (got '$PR_NUMBER')"; exit 1 ;;
          esac
          SUFFIX="-pr${PR_NUMBER}"
        fi
        echo "VERSION_SUFFIX=${SUFFIX}" >> "$GITHUB_ENV"
        # The same three parts the Build step composes into -p:Version, minus the hash. The publish job
        # checks every package's file name against this, so a disagreement fails closed there.
        echo "version=${PREFIX}${VERSION_REV}${SUFFIX}" >> "$GITHUB_OUTPUT"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_SUFFIX}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test -c $BUILD_CONF --no-build
    # DIR.Lib.Debug: the same library packed from a Debug build, at the same stamped version. A
    # published DIR.Lib is Release, so its #if DEBUG types (DIR.Lib.Diagnostics, the debug inspector)
    # are absent, and a plane never finds the sibling sources, so a Debug build there restored the
    # Release package and failed with CS0234. The twin is Debug by definition, whatever BUILD_CONF is.
    # GeneratePackageOnBuild is off so bin/Debug holds no second copy of the nupkg: the upload's
    # '**/*.nupkg' glob (and the push after it) must see DIR.Lib.Debug exactly once, from artifacts/debug-twin.
    - name: Pack DIR.Lib.Debug twin
      run: dotnet pack src/DIR.Lib/DIR.Lib.csproj -c Debug -p:DebugTwin=true -p:GeneratePackageOnBuild=false -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_SUFFIX}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true -o artifacts/debug-twin
    # Proves a Debug consumer compiles against the twin (it references DebugInspectorCore). The version
    # is the stamped one without the +sha build metadata (NuGet ignores it when matching, checked by hand,
    # so a plain reference is enough). A preview build keeps its -pr<N> suffix here, since the suffix is
    # part of the package's identity and the check restores exactly that version.
    - name: Check DIR.Lib.Debug twin
      run: dotnet build tools/debug-twin-check/DebugTwinCheck.csproj -c Debug -p:DirLibDebugVersion=${VERSION_PREFIX}${VERSION_REV}${VERSION_SUFFIX}
    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        # Not obj/: the consumer check restores into its own obj/packages, a package cache that holds a
        # .nupkg for every restored package (third-party ones too) and DIR.Lib.Debug a second time.
        path: |
          **/*.nupkg
          !**/obj/**
        retention-days: 5

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}

  # Preview packages. A consumer flight that needs a change this repo has not released yet pins the
  # prerelease this job publishes (<VersionMajorMinor>.<run><attempt>-pr<N>) while the PR is open, and
  # moves its pin to the real version once that publishes, before the consumer lands itself. A
  # prerelease sorts below the release of the same number, so that move never goes backwards.
  # Opt-in by the 'preview' label, because nuget.org prereleases are permanent: a version can be
  # unlisted but never deleted, and every push to a labelled PR leaves one behind. Label a PR when a
  # consumer needs it, not by habit.
  # The label is a convention, NOT a gate. Anyone who may label a PR (triage and up) starts a push
  # with the repository's NUGET_API_KEY. What bounds that is the head-repo test below: a same-repo
  # head means someone with write access pushed the code, and a writer can already edit this workflow
  # in their own PR to reach the key, so the label widens no one's reach; it only spares nuget.org
  # prereleases nobody asked for. An actual gate is a GitHub environment with required reviewers that
  # holds the key and that this job names. That is a repository setting, the owner's to add, and this
  # file does not pretend to be one.
  # Only for a PR whose head branch is in this repository: a fork PR gets no secrets, and must not try.
  # The condition is the one the version step uses to stamp the suffix, so a package is pushed here
  # exactly when it was stamped as a preview. The skip-duplicate flag makes a re-run of the same run and
  # attempt harmless. This job cannot fire on a push or a dispatch (the event must be pull_request),
  # and publish-nuget cannot fire on a pull request (its condition names main and the push and
  # dispatch events), so a package is never pushed by both.
  # The push cannot be rehearsed from a plane or a fork (it needs the real key and a same-repo PR run),
  # so this job is built to fail closed instead: nothing is pushed unless the version the build job
  # reports is a -pr<N> prerelease and every package in the artifact carries exactly that version. A
  # stamp that went wrong, which here would push a release-looking version nuget.org can never take
  # back, stops at the check step. The first labelled PR is the first real run, and whoever labels it
  # watches this job.
  publish-preview:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview') && github.event.pull_request.head.repo.full_name == github.repository
    # Only what the comment step needs. Setting any permission drops the rest to none, which is enough
    # here: the artifact comes through the run's own runtime token, not GITHUB_TOKEN.
    permissions:
      contents: read
      pull-requests: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
    - name: Check these are preview packages
      run: |
        case "$PR_NUMBER" in
          ''|*[!0-9]*) echo "::error::refusing to push: no numeric pull request number (got '$PR_NUMBER')"; exit 1 ;;
        esac
        case "$VERSION" in
          *-pr"$PR_NUMBER") ;;
          *) echo "::error::refusing to push: version '$VERSION' is not a -pr${PR_NUMBER} prerelease"; exit 1 ;;
        esac
        COUNT=0
        while IFS= read -r f; do
          COUNT=$((COUNT + 1))
          case "$f" in
            *".${VERSION}.nupkg") ;;
            *) echo "::error::refusing to push: $f is not version $VERSION"; exit 1 ;;
          esac
        done < <(find . -name '*.nupkg' -not -path '*/obj/*')
        if [ "$COUNT" -eq 0 ]; then
          echo "::error::refusing to push: the artifact holds no packages"; exit 1
        fi
        echo "$COUNT packages, all version $VERSION"
    - name: Push preview packages
      # The key goes in through env:, so it is never part of the script text.
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push **/*.nupkg -s nuget.org -k "$NUGET_API_KEY" --skip-duplicate
    # Tell the consumer WHAT was published, which it cannot guess: the version carries this run's number
    # and attempt. It goes in the run's job summary and, below, in a comment on the PR, where a
    # consumer flight finds it with 'gh pr view --comments'. Each push to a labelled PR publishes a new
    # version and adds a comment, so the newest comment is the one to pin.
    - name: State the published version
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        OUT="$RUNNER_TEMP/preview.md"
        {
          echo "### Preview packages published"
          echo
          echo "Version \`$VERSION\` of the packages below is on nuget.org. Pin exactly this version in a consumer, and move the pin to the release version before the consumer lands."
          echo
          find . -name '*.nupkg' -not -path '*/obj/*' | sort | while IFS= read -r f; do
            echo "- \`$(basename "$f" ".${VERSION}.nupkg")\`"
          done
          echo
          echo "nuget.org takes a few minutes to serve a new package; a restore answers NU1102 until it does."
          echo
          echo "Built from ${HEAD_SHA:0:7} by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        } > "$OUT"
        cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
    - name: Comment the version on the pull request
      # The packages are already published here and the summary above states the version, so a failure
      # to comment (a token without the permission, say) must not turn the job red.
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/preview.md"
